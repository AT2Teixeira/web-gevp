<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Perfil</title>
    <!-- Required meta tags -->
    {{> header}}
    <link rel="stylesheet" href="/perfil.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <img
        src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo%203.png"
        width="150"
        height="50"
        alt="Logo"
      />
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="/">Início</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="/perfil"
              >Perfil<span class="sr-only">(current)</span></a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/auth/logout"
              ><span class="badge badge-pill badge-danger">Sair</span></a
            >
          </li>
        </ul>
      </div>
    </nav>

    <div class="container">
      <div class="row profile">
        <div class="col-lg-3 pb-4">
          <div class="profile-sidebar pb-2">

            <div class="profile-userpic">
              <img
                src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Favatar.png"
                class="img-fluid"
                alt="Foto de perfil"
              />
            </div>
            <div class="profile-usertitle">
              <div class="profile-usertitle-name">{{user.name}}</div>
              {{#if perms.admin}}
                <div class="profile-usertitle-job">Desenvolvedor</div>
              {{/if}}
              {{#if perms.membro}}
                <div class="profile-usertitle-job">Cliente</div>
              {{/if}}
            </div>
            <div class="profile-userbuttons">
              <button onclick="painelFunction()" type="button" class="btn btn-success btn-sm">
                Painel de Gestão
              </button>
            </div>
            <div class="profile-usermenu">
              <ul class="nav">
                <li class="nav-item pb-2">
                  <a href="/perfil" class="nav-link">
                    <i class="glyphicon glyphicon-home"></i>
                    Geral
                  </a>
                </li>
                <li class="active nav-item">
                  <a href="/perfil/definicoes" class="nav-link">
                    <i class="glyphicon glyphicon-user"></i>
                    Definições
                  </a>
                </li>
              </ul>
            </div>

          </div>
        </div>
        <div class="col-lg-9">
          <div class="profile-content">
            
            <form action="/auth/perfil/definicoes" method="POST">
            <div class="my-3 p-3 bg-white rounded box-shadow">
              
              <h6 class="border-bottom border-gray pb-2 mb-0">Definições:</h6>
					<div class="pt-2">
						<div class="form-group">
							<label for="fullName">Nome de Usuário</label>
							<input type="text" class="form-control" name="name" placeholder="{{user.name}}">
						</div>
					</div>
					<div class="pt-2">
						<div class="form-group">
							<label for="eMail">Email</label>
							<input type="email" class="form-control" name="email" placeholder="{{user.email}}">
						</div>
					</div>
					<div class="pt-2">
						<div class="form-group">
							<label for="website">Alterar senha</label>
							<input type="password" class="form-control" name="senha_antiga" placeholder="Senha antiga">
              <input type="password" class="form-control" name="nova_senha" placeholder="Nova senha">
              <input type="password" class="form-control" name="confirmar_nova_senha" placeholder="Confirmar nova senha">
						</div>
					</div>
				</div>
				<div class="row gutters">
					<div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
						<div class="text-right">
							<button type="button" onclick="cancelFunction()" class="btn btn-secondary">Cancelar</button>
							<button type="submit" class="btn btn-primary">Confirmar</button>
						</div>
					</div>
				</div>     
              </form>
            </div>
            
          </div>
        </div>
      </div>

    <!-- Footer -->
    {{> footer}}

    <!-- Optional JavaScript -->
    {{> js}}
    {{#if message_sucesso}}
    <script>
        const Toast = Swal.mixin({
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 2000,
          timerProgressBar: true,
          didOpen: (toast) => {
            toast.addEventListener('mouseenter', Swal.stopTimer)
            toast.addEventListener('mouseleave', Swal.resumeTimer)
          }
        });

        Toast.fire({
          icon: 'success',
          title: '{{message_sucesso}}, aguarde...'
        });
      setTimeout(function() {
        location.replace('/perfil/definicoes')
      }, 2000);
    </script>
    {{/if}}
    {{#if message}}
    <script>
        const Toast = Swal.mixin({
          toast: true,
          position: 'top-end',
          showConfirmButton: false,
          timer: 3000,
          timerProgressBar: true,
          didOpen: (toast) => {
            toast.addEventListener('mouseenter', Swal.stopTimer)
            toast.addEventListener('mouseleave', Swal.resumeTimer)
          }
        });

        Toast.fire({
          icon: 'error',
          title: '{{message}}'
        });
    </script>
    {{/if}}
    <script>
      function painelFunction() {
        location.replace('/painel')
      }
    </script>
    <script>
      function cancelFunction() {
        location.replace('/perfil/definicoes')
      }
    </script>
  <script src="https://kit.fontawesome.com/53a74bb770.js" crossorigin="anonymous"></script>
  </body>
</html>
