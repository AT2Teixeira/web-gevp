<!doctype html>
<html lang="en">
  <head>
    <title>Registo</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<link rel="icon" href="/icon.png"/>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="sweetalert2/dist/sweetalert2.min.css">
    <script src="//code-sa1.jivosite.com/widget/8kgtvjrkSC" async></script>
  </head>
  <body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo.png?v=1616498503733" width="150" height="50" alt="Logo"/>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/login">Entrar</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="/cadastro">Cadastrar<span class="sr-only">(current)</span></a>
        </li>
    </ul>
  </div>
</nav>
    
      <div class="container mt-4">
          <div class="card">
            <div class="card-header">
                Cadastre-se agora!
            </div>
            <div class="card-body">
                <form action="/auth/cadastro" method="POST">
                
                <div class="form-group">
                    <label for="name">Primeiro e último nome</label>
                    <input type="text" class="form-control" id="name" name="name">
                </div>
                  
                <div class="form-group">
                    <label for="empresa">Nome da empresa</label>
                    <input type="text" class="form-control" id="empresa" name="empresa">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirmar Password</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm">
                </div>

                    <button type="submit" class="btn btn-primary">Registar</button>
                </form>
            </div>
          </div>
      </div>
<!-- Footer -->
<footer class="bg-dark text-center text-white">
  <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
    Todos os direitos reservados© | 2020 - 2021
  </div>
</footer>
    
    <!-- Optional JavaScript -->
    <script src="/redirect.js"></script>
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@10"></script>
    {{#if message}}
    <script>
      Swal.fire({
        position: 'top-end',
        icon: 'error',
        title: '{{message}}',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      })
    </script>
    {{/if}}
    {{#if message_sucesso}}
    <script>
      Swal.fire({
        position: 'top-end',
        icon: 'success',
        title: '{{message_sucesso}}',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      })
    </script>
    {{/if}}
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
  </body>
</html>
