<!doctype html>
<html lang="en">
  <head>
    <title>Registo</title>
    <!-- Required meta tags -->
    {{> header}}
  </head>
  <body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo.png?v=1616498503733" width="150" height="50" alt="Logo"/>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/login">Entrar</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="/cadastro">Cadastrar<span class="sr-only">(current)</span></a>
        </li>
    </ul>
  </div>
</nav>
    
      <div class="container mt-4">
          <div class="card">
            <div class="card-header">
                Cadastre-se agora!
            </div>
            <div class="card-body">
                <form action="/auth/cadastro" method="POST">
                
                <div class="form-group">
                    <label for="name">Primeiro e último nome</label>
                    <input type="text" class="form-control" id="name" name="name">
                </div>
                  
                <div class="form-group">
                    <label for="empresa">Nome da empresa</label>
                    <input type="text" class="form-control" id="empresa" name="empresa">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>

                <div class="form-group">
                    <label for="passwordConfirm">Confirmar Password</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm">
                </div>

                    <button type="submit" class="btn btn-primary">Registar</button>
                </form>
            </div>
          </div>
      </div>
<!-- Footer -->
{{> footer}}
    
    <!-- Optional JavaScript -->
    {{> js}}
    {{#if message}}
    <script>
      Swal.fire({
        position: 'top-end',
        icon: 'error',
        title: '{{message}}',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      })
    </script>
    {{/if}}

  </body>
</html>
