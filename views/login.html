<!doctype html>
<html lang="en">
  <head>
    <title>Entrar</title>
    <!-- Required meta tags -->
    {{> header}}
  </head>
  <body>
    
<nav class="navbar navbar-expand-lg navbar-dark">
  <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo%203.png" width="150" height="50" alt="Logo"/>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Início</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="/login">Entrar<span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cadastro">Cadastrar</a>
        </li>
    </ul>
  </div>
</nav>

      <div class="container mt-4 pb-5">
          <div class="card">
            <div class="card-header">
                Entre na sua conta!
            </div>
            <div class="card-body">
                <form action="/auth/login" method="POST">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
            <div class="card-footer">
              <a href="/esqueceu_password">Recuperar password</a>
            </div>
          </div>
      </div>

<!-- Footer -->
{{> footer}}
    
    <!-- Optional JavaScript -->
    {{> js}}
    <script src="/login.js"></script>
    
    {{#if message}}
    <script>
      Swal.fire({
        position: 'top-end',
        icon: 'error',
        title: '{{message}}',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      })
    </script>
    {{/if}}
  </body>
</html>
