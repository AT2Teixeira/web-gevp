<!doctype html>
<html lang="en">
  <head>
    <title>Entrar</title>
    <!-- Required meta tags -->
    {{> header}}
    <link rel="stylesheet" href="/form.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/solid.css">
  </head>
  <body>
    
<nav class="navbar navbar-expand-lg navbar-dark">
  <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo%203.png" width="150" height="50" alt="Logo"/>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">Início</a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="/login">Entrar<span class="sr-only">(current)</span></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/cadastro">Cadastrar</a>
        </li>
    </ul>
  </div>
</nav>
    
    
    <div class="modal-dialog text-center pb-5">
      <div class="col-sm-8 main-section">
        <div class="modal-content">
          
          <div class="col-12 user-img">
            <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Fface.png?v=1618742164594">
          </div>
          
          <form class="col-12" action="/auth/login" method="POST">
            <div class="form-group" id="um-login">
              <input type="email" class="form-control" name="email" placeholder="Email">
            </div>
            <div class="form-group" id="dois-login">
              <input type="password" class="form-control" name="password" placeholder="Password">
            </div>
            <button type="submit" class="btn">
              Login
            </button>
          </form>
          
          <div class="forgot col-12">
            <a href="/esqueceu_password">Recuperar password</a>
          </div>
          
        </div>
      </div>
    </div>

<!-- Footer -->
{{> footer}}
    
    <!-- Optional JavaScript -->
    {{> js}}
    <script src="/login.js"></script>
    
    {{#if message}}
    <script>
      Swal.fire({
        position: 'top-end',
        icon: 'error',
        title: '{{message}}',
        showConfirmButton: false,
        timer: 3000,
        timerProgressBar: true
      })
    </script>
    {{/if}}
  </body>
</html>
