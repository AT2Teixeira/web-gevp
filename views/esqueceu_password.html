<!doctype html>
<html lang="en">
  <head>
    <title>Recuperar Password</title>
    <!-- Required meta tags -->
    {{> header}}
  </head>
  <body>
    
<nav class="navbar navbar-expand-lg navbar-dark">
  <img src="https://cdn.glitch.com/3374c32f-e1b6-40af-bd2e-7e9ffe0ef5c6%2Flogo%203.png" width="150" height="50" alt="Logo"/>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="/login">Voltar<span class="sr-only">(current)</span></a>
        </li>
    </ul>
  </div>
</nav>

      <div class="container mt-4 pb-5 pt-3">
          <div class="card">
            <div class="card-header">
                Recupere a sua password!
            </div>
            <div class="card-body">
                <form action="/auth/esqueceu_password" method="POST">

                <div class="form-group">
                    <label for="email">Insira o seu email</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>

                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
          </div>
      </div>

<!-- Footer -->
{{> footer}}

    <!-- Optional JavaScript -->
    {{> js}}
    
    {{#if message}}
    <script>
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 4000,
        timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
      })

      Toast.fire({
        icon: 'error',
        title: '{{message}}'
      })
    </script>
    {{/if}}
    
    {{#if message_sucesso}}
    <script>
      const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 5000,
        timerProgressBar: true,
        didOpen: (toast) => {
          toast.addEventListener('mouseenter', Swal.stopTimer)
          toast.addEventListener('mouseleave', Swal.resumeTimer)
        }
      })

      Toast.fire({
        icon: 'success',
        title: '{{message_sucesso}}'
      })
    </script>
    {{/if}}
    
  </body>
</html>
